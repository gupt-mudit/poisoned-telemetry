# Retrieval check: 10 questions. Person A fills expected_short and expected_article from the
# OFFICIAL text. Target: at least 8 of 10 return the right article in the top 3.
questions:
  - q: "When must a personal data breach be notified, and to whom?"
    expected_short: "PDPL"   # PDPL Art. 9 - read in the official Arabic text 5 Nov (Claude); Person A to confirm
    expected_article: Article 9
  - q: "On what lawful bases may personal data be disclosed to a third party?"
    expected_short: "PDPL"   # PDPL Art. 4 (processing without consent) - Claude 5 Nov; Person A to confirm
    expected_article: Article 4
  - q: "What are the conditions for transferring personal data outside the country?"
    expected_short: "PDPL"   # PDPL Arts. 22-23 - Claude 5 Nov; Person A to confirm
    expected_article: Article 22
  - q: "What powers does the telecommunications regulator have over licensees?"
    expected_short: "UAE telecom law"   # FDL 3/2003 Art. 14 (regulations, instructions, requesting information) - Claude 6 Nov; Person A to confirm
    expected_article: Article 14
  - q: "What must a telecom operator report to the regulator about service disruptions?"
    expected_short: "Licence No. 2 of 2026"   # Licence 2/2026 Art. 12.9 (interruption of service) - Claude 6 Nov; Person A to confirm
    expected_article: Article 12
  - q: "What counts as unauthorised access to or interference with an information system?"
    expected_short: TO_FILL
    expected_article: TO_FILL
  - q: "What incident-management and reporting duties apply to entities under the information assurance standard?"
    expected_short: "UAE IA Regulation"   # IA Regulation v1.1 T8.3.2 reporting of security events - Claude 5 Nov; Person A to confirm
    expected_article: Control T8.3.2
  - q: "What principles govern accountability and human oversight of AI systems in the UAE?"
    expected_short: "UAE AI Charter"   # AI Charter Principle 6 Human Oversight (7 = accountability) - Claude 5 Nov; Person A to confirm
    expected_article: Principle 6
  - q: "How quickly must an essential entity give an early warning of a significant incident? (comparator)"
    expected_short: "2022/2555"  # NIS2 - confirmed on the official text 4 Nov
    expected_article: Article 23
  - q: "What logging is required for high-risk AI systems to ensure traceability? (comparator)"
    expected_short: "2024/1689"  # EU AI Act - confirmed on the official text 4 Nov
    expected_article: Article 12
