# Policy as code. Every rule MUST carry a source. While a source is not yet checked
# against the official text, status stays "draft" and strict mode refuses to load it.
version: 0.1
rules:
  - id: R-SUPPRESS-NEEDS-VERIFIED-CHANGE
    applies_to: [suppress_alert, mark_planned_maintenance]
    allow_if: "every approval claim is VERIFIED against the change log for this node and window"
    otherwise: BLOCK
    source:
      instrument: "UAE Information Assurance Regulation v1.1 (TDRA, 2020); operator change-management policy"
      provision: "IA Regulation controls T3.2.3 (Change Management: the entity shall control changes to information systems), T7.6.1 (Change Control Procedures: formal approval, audit trail of all change requests) and T3.6.2 (Audit Logging)"
      checked_by: "Claude, 5 Nov 2026, against the official text (KB copy) - Person A to confirm, then set status: verified"
      kb_ref: null
    status: draft

  - id: R-NO-EXTERNAL-PERSONAL-DATA
    applies_to: [send_external, send_report]
    block_if: "data_class == personal_data and destination is not an authorised controller or processor"
    require_human_if: "data_class == personal_data"
    allow_if: "data_class != personal_data and requester mandate is VERIFIED"
    source:
      instrument: "UAE PDPL, Federal Decree-Law 45/2021"
      provision: "Art. 4 (processing without consent prohibited unless an exception applies), Art. 7(1) and Art. 20(1) (technical and organisational security measures), Art. 8(5) (processor must not disclose personal data except where authorised by law), Arts. 22-23 (cross-border transfer)"
      checked_by: "Claude, 5 Nov 2026, against the official text (KB copy) - Person A to confirm, then set status: verified"
      kb_ref: null
    status: draft

  - id: R-AUTHORITY-FROM-REGISTERED-CHANNEL
    applies_to: [config_change, send_report, send_external]
    rule: "a claimed authority counts only if the request arrives from that agent's registered channel and its mandate permits the action"
    otherwise: BLOCK
    escalate_if: "the claimed authority is a regulator"
    source:
      instrument: "UAE telecom law (Federal Law by Decree 3/2003, as amended); Licence No. 2 of 2026 (TDRA, public version) as an example of licence conditions; operator channel policy"
      provision: "Telecom law Art. 12 (TDRA oversees Licensees) and Art. 14 (TDRA issues regulations, instructions and decisions; requests information); Licence 2/2026 Art. 6.2-6.3 (information to TDRA in a format TDRA sets, provided by an authorised employee who confirms accuracy) and Art. 8.3 (a direction to assume control must be received in writing). Neither text says how an instruction is authenticated when it reaches a machine channel: the registered-channel requirement itself is operator policy, not law (see gap G3)"
      checked_by: "Claude, 6 Nov 2026, against the official texts (KB copies; telecom law is OCR) - Person A to confirm, then set status: verified"
      kb_ref: null
    status: draft

  - id: R-EMERGENCY-ONLY-PERMITTED-ACTIONS
    applies_to: [emergency_reroute, config_change]
    allow_if: "a VERIFIED incident exists, the authoriser's mandate VERIFIES may_approve for the action, and the action is in the permitted emergency list"
    permitted_emergency_actions: [emergency_reroute]
    otherwise: ESCALATE
    source:
      instrument: "UAE Information Assurance Regulation v1.1 (TDRA, 2020); operator emergency change procedure"
      provision: "IA Regulation T3.2.3(4) (assign management responsibilities for control of changes), T8.2.2(7) (CSIRT roles, responsibilities and corresponding authority); the permitted-action list itself is operator policy, not law"
      checked_by: "Claude, 5 Nov 2026, against the official text (KB copy) - Person A to confirm, then set status: verified"
      kb_ref: null
    status: draft
